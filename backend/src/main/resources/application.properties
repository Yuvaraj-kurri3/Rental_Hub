spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
spring.application.name=rental-hub
server.port=8081
spring.datasource.url=jdbc:${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT secret can be overridden with the JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET:RentalHubJWTSecretKey_2026_Strong_Demo_ChangeMe_987654321}
